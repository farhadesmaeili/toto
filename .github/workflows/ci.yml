name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  test-api:
    name: API — Test & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toto_user
          POSTGRES_PASSWORD: toto_pass
          POSTGRES_DB: toto_test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://toto_user:toto_pass@localhost:5432/toto_test_db
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-test-access-secret-min-32-chars
      JWT_REFRESH_SECRET: ci-test-refresh-secret-min-32-chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: toto-api/package-lock.json

      - name: Install API dependencies
        run: cd toto-api && npm ci

      - name: Apply database migrations
        run: cd toto-api && npx prisma migrate deploy

      - name: Run unit tests with coverage
        run: cd toto-api && npm run test:cov

      - name: Run e2e tests
        run: cd toto-api && npm run test:e2e

  build-api:
    name: API — Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: toto-api/package-lock.json

      - name: Install API dependencies
        run: cd toto-api && npm ci

      - name: Build
        run: cd toto-api && npm run build

  build-web:
    name: Web — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: toto-web/package-lock.json

      - name: Install web dependencies
        run: cd toto-web && npm ci

      - name: Build
        run: cd toto-web && npm run build

      - name: Run component tests
        run: cd toto-web && npm test -- --passWithNoTests
